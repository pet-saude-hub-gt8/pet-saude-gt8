site_name: "PET-Saúde GT 8 | HUB - UnB"

theme:
  name: material
  custom_dir: overrides
  language: pt
  logo: assets/img/logo_pet.jpg
  favicon: assets/img/logo_pet.jpg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # 1. Esquema Claro (Light Mode)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro

    # 2. Esquema Escuro (Dark Mode)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro

plugins: []

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Início: index.md
  - Contexto: contexto.md
  - Equipe: equipe.md
  - Encaminhamentos: encaminhamentos.md
  - Protótipo: prototipo.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
